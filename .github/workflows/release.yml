# release.yml — 打 tag v* 自动构建全部发布物并创建 GitHub Release
#
# 产物命名：一个平台一个文件，固定名、不带版本号（版本看 Release tag）、无别名：
#   samcdp-windows-amd64.exe   Windows x64
#   samcdp-linux-amd64         Linux x64
#   samcdp-darwin-arm64        macOS Apple Silicon
#   samcdp-darwin-amd64        macOS Intel
#   samcdp-android.apk         Android（通用）
#
# Release 页不带文字描述：只有标题 + 资产列表，用户进来直接下载（用户要求）；
# 变更说明写在 commit message / README。
# 手动 workflow_dispatch 触发时只构建、不发布（干跑）。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.23.4"

jobs:
  # ---------- windows + linux：ubuntu runner，CGO=0 交叉编译 ----------
  desktop:
    name: desktop (${{ matrix.goos }}-amd64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, ext: ".exe", gui: "true" }
          - { goos: linux, ext: "", gui: "false" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Windows icon/manifest → rsrc_windows.syso
        if: matrix.goos == 'windows'
        run: |
          go run github.com/akavel/rsrc@v0.10.2 \
            -ico appicon.ico -manifest cdpclient.exe.manifest -arch amd64 \
            -o rsrc_windows.syso
          ls -la rsrc_windows.syso

      - name: Build ${{ matrix.goos }}-amd64
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: |
          LDFLAGS="-s -w"
          [ "${{ matrix.gui }}" = "true" ] && LDFLAGS="$LDFLAGS -H windowsgui"
          go build -trimpath -ldflags "$LDFLAGS" \
            -o "samcdp-${{ matrix.goos }}-amd64${{ matrix.ext }}" .
          ls -la samcdp-*

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.goos }}-amd64
          path: samcdp-*
          if-no-files-found: error

  # ---------- darwin：macos runner 原生 CGO（托盘必须 CGO，Linux 上无法交叉出可用产物） ----------
  darwin:
    name: desktop (darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # runner 默认 shell 未导出 SDKROOT，cgo 编译 runtime/cgo 时找不到 stdlib.h（干跑实测）
      - name: Export macOS SDK root
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Build darwin-arm64 (native CGO) + darwin-amd64 (cross CGO)
        run: |
          # apple silicon：原生构建
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w" \
            -o samcdp-darwin-arm64 .
          # intel：Apple clang 指定 -arch x86_64 交叉（cgo 走同一工具链，同一 SDK）
          CGO_ENABLED=1 GOARCH=amd64 CC="$(xcrun -f clang) -arch x86_64" \
            go build -trimpath -ldflags "-s -w" \
            -o samcdp-darwin-amd64 .
          ls -la samcdp-*

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-darwin
          path: samcdp-*
          if-no-files-found: error

  # ---------- android：aapt2 + ecj + d8 + apksigner（android/build.sh） ----------
  android:
    name: android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_BT: "34.0.0"
      ANDROID_PLAT: "android-34"
      ECJ_VER: "3.33.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages (build-tools 34.0.0 + platform android-34)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;${ANDROID_BT}" "platforms;${ANDROID_PLAT}"

      - name: Fetch ECJ (Eclipse compiler, Java 8 source/target compatible)
        run: |
          mkdir -p /tmp/sdk
          curl -fsSL -o /tmp/sdk/ecj.jar \
            "https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/${ECJ_VER}/ecj-${ECJ_VER}.jar"
          ls -la /tmp/sdk/ecj.jar

      - name: Assemble SDK_DIR layout expected by android/build.sh
        run: |
          ln -sfn "$ANDROID_HOME/build-tools/${ANDROID_BT}" /tmp/sdk/android-14   # 仓库内目录名沿用 android-14 = build-tools 34
          ln -sfn "$ANDROID_HOME/platforms/${ANDROID_PLAT}" /tmp/sdk/android-34
          ls -la /tmp/sdk /tmp/sdk/android-14 | head -20

      - name: Build APK (android/build.sh)
        run: |
          SDK_DIR=/tmp/sdk bash android/build.sh
          # 统一资产名：samcdp-android.apk（一个平台一个文件，不带版本号）
          cp android/build/SamCDP-android-v*.apk samcdp-android.apk
          ls -la android/build/ samcdp-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: samcdp-android.apk
          if-no-files-found: error

  # ---------- 发布：汇总全部产物，创建 Release（纯下载列表，无文字描述） ----------
  release:
    name: create GitHub Release
    needs: [desktop, darwin, android, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -la dist/

      # 不带 --notes/--notes-file/--generate-notes：发布页只有标题 + 资产列表，
      # 用户点进来直接下载；变更说明看 commit message / README
      - name: Create Release (assets only — no description)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SamCDP $GITHUB_REF_NAME" \
            --latest

  # ---------- windows 安装包：Inno Setup 打包 samcdp-windows-amd64.exe ----------
  installer:
    name: windows setup.exe (Inno Setup)
    needs: [desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download windows exe artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-amd64
          path: exe

      - name: Stage files for ISCC
        shell: pwsh
        run: |
          Copy-Item exe/samcdp-windows-amd64.exe cdpclient.exe
          Get-Item cdpclient.exe | Select-Object Name, Length

      - name: Locate Inno Setup (ISCC)
        id: iscc
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "ISCC not found, installing via Chocolatey..."
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          "path=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Resolve Chinese language file
        id: cnisl
        shell: pwsh
        run: |
          $innoDir = Split-Path "${{ steps.iscc.outputs.path }}"
          $found = Get-ChildItem -Path $innoDir -Recurse -Filter "ChineseSimplified.isl" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
            $cn = $found.FullName
          } else {
            $cn = Join-Path $env:RUNNER_TEMP "ChineseSimplified.isl"
            $urls = @(
              "https://raw.githubusercontent.com/jrsoftware/issrc/is-6_4_1/Files/Languages/Unofficial/ChineseSimplified.isl",
              "https://raw.githubusercontent.com/jrsoftware/issrc/is-7_1_1/Files/Languages/ChineseSimplified.isl"
            )
            $ok = $false
            foreach ($u in $urls) {
              try { Invoke-WebRequest -Uri $u -OutFile $cn; $ok = $true; break } catch { Write-Host "miss: $u" }
            }
            if (-not $ok) { throw "Cannot obtain ChineseSimplified.isl" }
          }
          "path=$cn" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build setup.exe (Inno Setup)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          & "${{ steps.iscc.outputs.path }}" "/DMyAppVersion=$v" "/DCnMessages=${{ steps.cnisl.outputs.path }}" "/DOutputBaseFilename=SamCDP-$v-windows-amd64-setup.exe" /Q cdpclient.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Mirror release artifacts to ModelScope + HuggingFace and update the unified
  # catalog (samaidev/samai-releases). Tag pushes only, after Release job.
  # ---------------------------------------------------------------------------
  mirror-catalog:
    name: Mirror (MS/HF) + update catalog
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install upload SDKs
        run: pip install huggingface_hub modelscope

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir assets --repo "$GITHUB_REPOSITORY"
          ls -lh assets

      - name: Fetch current catalog (single source of truth)
        run: |
          curl -fsSL -o catalog.json \
            https://raw.githubusercontent.com/samaidev/samai-releases/main/catalog.json

      - name: Mirror to MS/HF + update catalog
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MS_TOKEN: ${{ secrets.MS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python ci/publish_channels.py \
            --dist assets --product samcdp --version "$GITHUB_REF_NAME" \
            --repo samaidev/samcdp --catalog catalog.json \
            --glob "samcdp"
