# ci.yml — 每次 push / PR 的快速门禁：go vet + 桌面编译 + Android APK 编译
# （发布走 release.yml，tag v* 触发）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------- 桌面版：go vet + linux/windows 交叉编译冒烟 ----------
  desktop:
    name: vet + build (${{ matrix.goos }}-amd64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"
          cache: true

      - name: go vet
        run: go vet .

      - name: go build (${{ matrix.goos }})
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: |
          LDFLAGS="-s -w"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            LDFLAGS="$LDFLAGS -H windowsgui"
          fi
          go build -trimpath -ldflags "$LDFLAGS" -o "samcdp-${{ matrix.goos }}-amd64$( [ '${{ matrix.goos }}' = 'windows' ] && echo .exe )" .
          ls -la samcdp-*

      # Windows 图标/manifest 资源生成冒烟（release.yml 同一命令，保证不因 rsrc 版本漂移挂掉）
      - name: rsrc smoke (windows only)
        if: matrix.goos == 'windows'
        run: |
          go run github.com/akavel/rsrc@v0.10.2 \
            -ico appicon.ico -manifest cdpclient.exe.manifest -arch amd64 \
            -o /tmp/rsrc_windows.syso
          ls -la /tmp/rsrc_windows.syso

  # ---------- Android APK 编译：aapt2 + ecj + d8 + apksigner ----------
  # 每次 push/PR 都编译 Android APK，及早发现 Java 编译错误和资源问题。
  # 构建步骤与 release.yml 的 android job 完全一致（经过验证的 SDK 布局 + build.sh）。
  android:
    name: android APK build
    runs-on: ubuntu-latest
    env:
      ANDROID_BT: "34.0.0"
      ANDROID_PLAT: "android-34"
      ECJ_VER: "3.33.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages (build-tools 34.0.0 + platform android-34)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;${ANDROID_BT}" "platforms;${ANDROID_PLAT}"

      - name: Fetch ECJ (Eclipse compiler, Java 8 source/target compatible)
        run: |
          mkdir -p /tmp/sdk
          curl -fsSL -o /tmp/sdk/ecj.jar \
            "https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/${ECJ_VER}/ecj-${ECJ_VER}.jar"
          ls -la /tmp/sdk/ecj.jar

      - name: Assemble SDK_DIR layout expected by android/build.sh
        run: |
          ln -sfn "$ANDROID_HOME/build-tools/${ANDROID_BT}" /tmp/sdk/android-14
          ln -sfn "$ANDROID_HOME/platforms/${ANDROID_PLAT}" /tmp/sdk/android-34
          ls -la /tmp/sdk /tmp/sdk/android-14 | head -20

      - name: Build APK (android/build.sh)
        run: |
          SDK_DIR=/tmp/sdk bash android/build.sh
          cp android/build/SamCDP-android-v*.apk samcdp-android.apk
          ls -la android/build/ samcdp-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-ci
          path: samcdp-android.apk
          if-no-files-found: error
