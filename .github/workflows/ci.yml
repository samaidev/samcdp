# ci.yml — 每次 push / PR 的快速门禁：go vet + 三平台编译冒烟
# （发布走 release.yml，tag v* 触发）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: vet + build (${{ matrix.goos }}-amd64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"
          cache: true

      - name: go vet
        run: go vet .

      - name: go build (${{ matrix.goos }})
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: |
          LDFLAGS="-s -w"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            LDFLAGS="$LDFLAGS -H windowsgui"
          fi
          go build -trimpath -ldflags "$LDFLAGS" -o "samcdp-${{ matrix.goos }}-amd64$( [ '${{ matrix.goos }}' = 'windows' ] && echo .exe )" .
          ls -la samcdp-*

      # Windows 图标/manifest 资源生成冒烟（release.yml 同一命令，保证不因 rsrc 版本漂移挂掉）
      - name: rsrc smoke (windows only)
        if: matrix.goos == 'windows'
        run: |
          go run github.com/akavel/rsrc@v0.10.2 \
            -ico appicon.ico -manifest cdpclient.exe.manifest -arch amd64 \
            -o /tmp/rsrc_windows.syso
          ls -la /tmp/rsrc_windows.syso
